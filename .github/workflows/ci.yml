name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Shell, behavior, and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bats
        timeout-minutes: 5
        run: |
          set -u
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 &&
               sudo apt-get install --yes --no-install-recommends bats; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Check Bash syntax independently
        shell: bash
        run: |
          set -euo pipefail
          for file in install.sh uninstall.sh bin/ternux bin/ternux-guest lib/*.sh; do
            bash -n "$file"
          done

      - name: Run focused regressions
        run: bash tests/focused.sh

      - name: Run Bats smoke suite
        run: bats tests/smoke.bats

      - name: Render the installer UI in a pseudo terminal
        run: python3 tests/ui_render.py

      - name: Validate documentation and bilingual site structure
        run: python3 tests/docs_check.py

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/docs.js
          node --check assets/js/codecopy.js

      - name: Reject whitespace errors in the committed change
        run: git show --check --format= HEAD
