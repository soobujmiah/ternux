name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Shell, behavior, and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up website build runtime
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build Astro website
        run: |
          npm ci
          npm run build

      - name: Install Bats
        timeout-minutes: 5
        run: |
          set -u
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 &&
               sudo apt-get install --yes --no-install-recommends bats python3-numpy curl gnupg xz-utils; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Check Bash syntax independently
        shell: bash
        run: |
          set -euo pipefail
          for file in install.sh uninstall.sh bin/ternux bin/ternux-guest lib/*.sh packaging/termux/*.sh; do
            bash -n "$file"
          done

      - name: Verify workload manifest and generated registry
        run: python3 tools/generate_workload_registry.py --check

      - name: Verify pinned optional installer execution
        run: bash tests/pinned_optional_installers.sh

      - name: Run focused regressions
        run: bash tests/focused.sh

      - name: Run multi-distro lifecycle and shortcut matrix
        run: bash tests/distro_multi_guest.sh

      - name: Qualify Firefox package routes in clean distro-family containers
        run: bash tests/firefox_package_matrix.sh

      - name: Validate machine-readable release gates
        run: python3 tests/release_gates.py --self-test

      - name: Verify generated repository-state check wait window
        run: python3 tests/repo_state_sync_workflow_test.py

      - name: Test QNN CLIP tokenizer and input conditioning
        run: python3 -m unittest discover -s experiments/qnn-native -p 'test_clip*.py' -v

      - name: Test QNN SD1.5 batch runner
        run: python3 -m unittest discover -s experiments/qnn-native -p 'test_sd15_qnn_image.py' -v

      - name: Test Termux APT bootstrap
        run: bash tests/termux_apt_bootstrap.sh

      - name: Test signed APT preservation in website deploys
        run: bash tests/termux_apt_pages_preservation.sh

      - name: Run Bats smoke suite
        run: bats tests/smoke.bats

      - name: Render the installer UI in a pseudo terminal
        run: python3 tests/ui_render.py

      - name: Validate documentation and bilingual site structure
        run: python3 tests/docs_check.py

      - name: Check JavaScript syntax
        run: node --check scripts/finalize-site.mjs

      - name: Check website source formatting
        run: npm run format:check

      - name: Reject whitespace errors in the committed change
        run: git show --check --format= HEAD
