name: Deploy Ternux website

on:
  # Production Pages deployment requires an explicit workflow dispatch.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Keep signed APT publication and explicitly dispatched website deployment serialized.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - run: npm ci
      - run: npm run build
      - name: Install signed-repository verification tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends curl gnupg xz-utils
      - name: Preserve both previously published signed APT channels
        run: |
          bash packaging/termux/preserve-pages-apt.sh dist stable
          bash packaging/termux/preserve-pages-apt.sh dist rc
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
