name: llama.cpp Hexagon HTP artifact

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the built artifact to the experimental draft release
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/llama-htp-artifact.yml'
      - 'tools/llama-htp/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'LICENSE-SCOPE.md'
      - 'LICENSE-COMMERCIAL-ADDENDUM.md'
      - 'THIRD_PARTY_NOTICES.md'

permissions:
  contents: read

concurrency:
  group: llama-htp-b11582-v73
  cancel-in-progress: false

jobs:
  build:
    name: Build pinned Snapdragon Linux package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out Ternux release metadata
        uses: actions/checkout@v4

      - name: Check out pinned llama.cpp source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: af50f2f248b475d9760f8e67503d01c0f194f5f4
          path: llama.cpp

      - name: Verify source pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C llama.cpp rev-parse HEAD)" = "af50f2f248b475d9760f8e67503d01c0f194f5f4"

      - name: Build for Snapdragon Linux with the pinned upstream toolchain
        shell: bash
        run: |
          set -euo pipefail
          cp llama.cpp/docs/backend/snapdragon/CMakeUserPresets.json llama.cpp/CMakeUserPresets.json
          mkdir -p llama.cpp/tools/llama-htp
          cp tools/llama-htp/broker_open.c llama.cpp/tools/llama-htp/broker_open.c
          docker run --rm \
            --platform linux/amd64 \
            -u "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE/llama.cpp:/workspace" \
            --workdir /workspace \
            ghcr.io/snapdragon-toolchain/arm64-linux@sha256:41b710ee5f99d21f0fb9d83a1f815ecffb7708315b4218a11cd0baeb5ecf4c14 \
            bash -lc '
            printf "\nadd_library(ternux-htp-broker SHARED tools/llama-htp/broker_open.c)\ntarget_link_libraries(ternux-htp-broker PRIVATE \${CMAKE_DL_LIBS})\ninstall(TARGETS ternux-htp-broker LIBRARY DESTINATION lib)\n" >> CMakeLists.txt &&
            cmake --preset arm64-linux-snapdragon-release -B build-ternux-htp-b11582 &&
            cmake --build build-ternux-htp-b11582 -j 4 &&
            cmake --install build-ternux-htp-b11582 --prefix pkg-ternux-htp-b11582/llama.cpp &&
            test -f pkg-ternux-htp-b11582/llama.cpp/lib/libternux-htp-broker.so
            '

      - name: Package and inspect target files
        shell: bash
        run: |
          set -euo pipefail
          package="llama.cpp/pkg-ternux-htp-b11582/llama.cpp"
          test -x "$package/bin/llama-cli"
          test -f "$package/lib/libggml-hexagon.so"
          test -f "$package/lib/libggml-htp-v73.so"
          test -f "$package/lib/libternux-htp-broker.so"
          file "$package/lib/libternux-htp-broker.so" | tee htp-broker-file.txt
          grep -q 'aarch64' htp-broker-file.txt
          file "$package/bin/llama-cli" | tee llama-cli-file.txt
          grep -q 'aarch64' llama-cli-file.txt
          mkdir -p release/ternux-llama-htp-sm8735-b11582
          cp -a "$package/." release/ternux-llama-htp-sm8735-b11582/
          python3 - <<'PY_LICENSES'
          from pathlib import Path
          import shutil
          import subprocess

          package = Path("release/ternux-llama-htp-sm8735-b11582")
          destination = package / "upstream-licenses"
          paths = subprocess.run(
              ["git", "-C", "llama.cpp", "ls-files", "-z"],
              check=True, capture_output=True,
          ).stdout.split(b"\0")
          def is_license_file(raw_path: bytes) -> bool:
              name = Path(raw_path.decode("utf-8")).name.upper()
              if name.endswith(".CMAKE"):
                  return False
              return (name in {"LICENSE", "COPYING", "NOTICE"} or
                      name.startswith(("LICENSE.", "LICENSE-", "COPYING.", "COPYING-", "NOTICE.", "NOTICE-")))

          licenses = sorted(path.decode("utf-8") for path in paths if path and is_license_file(path))
          if not licenses:
              raise SystemExit("pinned upstream source contains no tracked license files")
          for relative in licenses:
              target = destination / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(Path("llama.cpp") / relative, target)
          (destination / "INDEX.txt").write_text("\n".join(licenses) + "\n", encoding="utf-8")
          PY_LICENSES
          test -s release/ternux-llama-htp-sm8735-b11582/upstream-licenses/licenses/LICENSE-jsonhpp
          test -s release/ternux-llama-htp-sm8735-b11582/upstream-licenses/vendor/cpp-httplib/LICENSE
          install -D -m 0755 tools/llama-htp/htp-run \
            release/ternux-llama-htp-sm8735-b11582/bin/htp-run
          install -D -m 0644 tools/llama-htp/htp-broker.py \
            release/ternux-llama-htp-sm8735-b11582/libexec/htp-broker.py
          install -D -m 0644 tools/llama-htp/README.md \
            release/ternux-llama-htp-sm8735-b11582/HTP-EXPERIMENTAL-README.md
          cp llama.cpp/LICENSE release/ternux-llama-htp-sm8735-b11582/LLAMA-CPP-LICENSE
          cp LICENSE release/ternux-llama-htp-sm8735-b11582/TERNUX-LICENSE
          cp NOTICE release/ternux-llama-htp-sm8735-b11582/TERNUX-NOTICE
          cp LICENSE-SCOPE.md release/ternux-llama-htp-sm8735-b11582/TERNUX-LICENSE-SCOPE.txt
          cp LICENSE-COMMERCIAL-ADDENDUM.md release/ternux-llama-htp-sm8735-b11582/TERNUX-COMMERCIAL-ADDENDUM.txt
          cp THIRD_PARTY_NOTICES.md release/ternux-llama-htp-sm8735-b11582/TERNUX-THIRD-PARTY-NOTICES.txt
          cat > release/ternux-llama-htp-sm8735-b11582/README.txt <<'EOF'
          Ternux experimental llama.cpp Hexagon HTP package

          Target: Linux aarch64 / Qualcomm Hexagon HTP, with the V73 library
          Source: ggml-org/llama.cpp tag b11582
          Source commit: af50f2f248b475d9760f8e67503d01c0f194f5f4
          Build: upstream scripts/snapdragon/build.py using the
          ghcr.io/snapdragon-toolchain/arm64-linux:v0.7 toolchain image

          This package is an experimental test artifact. It includes a Ternux
          Binder/FastRPC broker launcher configured for the constrained HVX
          matmul / flash-attention-off route. See HTP-EXPERIMENTAL-README.md.
          Some HMX and flash-attention combinations returned incorrect text.
          Device qualification is recorded separately in Ternux's experimental
          HTP guide and accelerator release plan; this build does not claim
          supported or production-ready NPU inference.

          Upstream license and notice texts, with source paths, are indexed under upstream-licenses/.
          The Ternux first-party adapter terms and third-party scope are recorded in
          TERNUX-LICENSE, TERNUX-LICENSE-SCOPE.txt, TERNUX-NOTICE, and
          TERNUX-THIRD-PARTY-NOTICES.txt. Company use needs a separate commercial license.
          TERNUX-COMMERCIAL-ADDENDUM.txt contains the exact additional condition.

          The package does not include Qualcomm vendor libraries, firmware,
          or device permission changes. Install libgbinder1, libglibutil1,
          libfastrpc1, and libfastrpc-dev in Debian before running bin/htp-run.
          Do not change device node permissions. No model weights are bundled.
          EOF
          cat > release/ternux-llama-htp-sm8735-b11582/build-manifest.json <<'EOF'
          {
            "artifact": "ternux-llama-htp-sm8735-b11582",
            "target": "linux-aarch64",
            "soc_test_target": "Qualcomm SM8735 / Hexagon HTP V73",
            "upstream": "https://github.com/ggml-org/llama.cpp",
            "upstream_tag": "b11582",
            "upstream_commit": "af50f2f248b475d9760f8e67503d01c0f194f5f4",
            "toolchain_image": "ghcr.io/snapdragon-toolchain/arm64-linux:v0.7",
            "toolchain_image_digest": "sha256:41b710ee5f99d21f0fb9d83a1f815ecffb7708315b4218a11cd0baeb5ecf4c14",
            "build_command": "cmake --preset arm64-linux-snapdragon-release -B build-ternux-htp-b11582; cmake --build build-ternux-htp-b11582 -j 4; cmake --install build-ternux-htp-b11582 --prefix pkg-ternux-htp-b11582/llama.cpp; build ternux-htp-broker through the pinned AArch64 CMake toolchain",
            "htp_libraries": ["libggml-hexagon.so", "libggml-htp-v73.so"],
            "device_validation": "experimental; this manifest records build provenance only. Consult Ternux docs/ACCELERATOR-RELEASE-PLAN.md for current device qualification",
            "experimental_adapter": ["bin/htp-run", "libexec/htp-broker.py", "lib/libternux-htp-broker.so"],
            "runtime_dependencies": ["libgbinder.so.1", "libglibutil.so.1", "libcdsprpc.so.1", "libcdsprpc.so", "python3"],
            "debian_packages": ["libgbinder1", "libglibutil1", "libfastrpc1", "libfastrpc-dev", "python3"],
            "license_files": ["LLAMA-CPP-LICENSE", "upstream-licenses/INDEX.txt", "TERNUX-LICENSE", "TERNUX-LICENSE-SCOPE.txt", "TERNUX-COMMERCIAL-ADDENDUM.txt", "TERNUX-NOTICE", "TERNUX-THIRD-PARTY-NOTICES.txt"]
          }
          EOF
          tar -C release -czf ternux-llama-htp-sm8735-b11582.tar.gz ternux-llama-htp-sm8735-b11582
          sha256sum ternux-llama-htp-sm8735-b11582.tar.gz > ternux-llama-htp-sm8735-b11582.tar.gz.sha256
          tar -tzf ternux-llama-htp-sm8735-b11582.tar.gz > archive-contents.txt
          while IFS= read -r license_path; do
            grep -Fqx "ternux-llama-htp-sm8735-b11582/upstream-licenses/$license_path" archive-contents.txt
          done < release/ternux-llama-htp-sm8735-b11582/upstream-licenses/INDEX.txt
          for license_path in TERNUX-LICENSE TERNUX-LICENSE-SCOPE.txt TERNUX-COMMERCIAL-ADDENDUM.txt TERNUX-NOTICE TERNUX-THIRD-PARTY-NOTICES.txt; do
            grep -Fqx "ternux-llama-htp-sm8735-b11582/$license_path" archive-contents.txt
          done
          sed -n '1,40p' archive-contents.txt

      - name: Upload build artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: ternux-llama-htp-sm8735-b11582
          path: |
            ternux-llama-htp-sm8735-b11582.tar.gz
            ternux-llama-htp-sm8735-b11582.tar.gz.sha256
            archive-contents.txt
            htp-broker-file.txt
            llama-cli-file.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the exact build artifact
        uses: actions/download-artifact@v4
        with:
          name: ternux-llama-htp-sm8735-b11582
          path: release

      - name: Create or refresh draft experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=ternux-llama-htp-sm8735-b11582
          cat > release-notes.md <<'EOF'
          ## Experimental Snapdragon HTP package

          Built from llama.cpp `b11582` commit `af50f2f248b475d9760f8e67503d01c0f194f5f4`
          using Qualcomm's upstream Snapdragon Linux toolchain image `v0.7`.

          Includes Linux aarch64 llama.cpp tools and Hexagon V73 backend/skeleton
          libraries, plus the experimental Ternux Binder/FastRPC launcher.
          Intended for experimental validation on Snapdragon 8s Gen 4 (SM8735)
          from Ternux/PRoot. Install Debian runtime dependencies
          `libgbinder1`, `libglibutil1`, `libfastrpc1`, and `libfastrpc-dev`
          first.

          **Known limitation:** the upstream b11582 backend returned wrong
          answers with HMX-selected matmul and with flash attention enabled.
          A bounded HVX-only / flash-attention-off setup returned the expected
          answer and completed a long recall-key workload on SM8735, but was
          slower than Vulkan. This release is an experimental artifact, not a
          supported or production-ready NPU feature. Retest this exact packaged
          broker/launcher, cancellation cleanup, and restart before qualification.

          The archive does not bundle Qualcomm vendor runtime libraries or
          firmware and does not change device permissions. Its broker is
          experimental; cancellation/fallback remain unqualified.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              release/ternux-llama-htp-sm8735-b11582.tar.gz \
              release/ternux-llama-htp-sm8735-b11582.tar.gz.sha256 --clobber
            gh release edit "$tag" \
              --title 'Experimental llama.cpp HTP V73 for SM8735 (b11582)' \
              --notes-file release-notes.md --prerelease
          else
            gh release create "$tag" \
              release/ternux-llama-htp-sm8735-b11582.tar.gz \
              release/ternux-llama-htp-sm8735-b11582.tar.gz.sha256 \
              --draft --prerelease \
              --title 'Experimental llama.cpp HTP V73 for SM8735 (b11582)' \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
