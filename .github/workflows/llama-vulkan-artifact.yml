name: llama.cpp CPU + Vulkan artifact

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/llama-vulkan-artifact.yml"
      - "tools/generate_llama_vulkan_component_manifest.py"
      - "tests/llama_vulkan_abi_audit.py"
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Update the public optional prerelease after the artifact audit
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: llama-vulkan-b11582
  cancel-in-progress: false

jobs:
  build:
    name: Build pinned Linux ARM64 CPU + Vulkan package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out Ternux metadata
        uses: actions/checkout@v5

      - name: Install Vulkan build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build git pkg-config libvulkan-dev glslc \
            libshaderc-dev glslang-dev glslang-tools spirv-headers \
            libssl-dev libgomp1 libvulkan1

      - name: Check out pinned llama.cpp source
        uses: actions/checkout@v5
        with:
          repository: ggml-org/llama.cpp
          ref: af50f2f248b475d9760f8e67503d01c0f194f5f4
          path: llama.cpp

      - name: Verify source pin and native target
        run: |
          set -euo pipefail
          test "$(git -C llama.cpp rev-parse HEAD)" = \
            af50f2f248b475d9760f8e67503d01c0f194f5f4
          test "$(uname -m)" = aarch64

      - name: Configure, build, install, and inspect
        shell: bash
        run: |
          set -euo pipefail
          package="$GITHUB_WORKSPACE/package/ternux-llama-vulkan-linux-arm64-b11582"
          cmake -S llama.cpp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$package" \
            -DCMAKE_INSTALL_RPATH='$ORIGIN/../lib' \
            -DGGML_NATIVE=OFF \
            -DGGML_VULKAN=ON \
            -DGGML_HEXAGON=OFF \
            -DGGML_OPENCL=OFF \
            -DLLAMA_BUILD_TESTS=OFF
          cmake --build build --parallel 4
          cmake --install build --prefix "$package"
          install -m 0644 llama.cpp/LICENSE "$package/LLAMA-CPP-LICENSE"
          python3 - "$package" <<'PY_LICENSES'
          from pathlib import Path
          import hashlib
          import shutil
          import subprocess
          import sys

          source = Path("llama.cpp")
          destination = Path(sys.argv[1]) / "share/licenses/upstream"
          paths = subprocess.run(
              ["git", "-C", str(source), "ls-files", "-z"],
              check=True, capture_output=True,
          ).stdout.split(b"\0")

          def is_license_file(raw_path: bytes) -> bool:
              name = Path(raw_path.decode("utf-8")).name.upper()
              if name.endswith(".CMAKE"):
                  return False
              stems = ("LICENSE", "LICENCE", "COPYING", "NOTICE", "COPYRIGHT",
                       "AUTHORS", "PATENTS", "UNLICENSE")
              return any(name == stem or name.startswith((stem + ".", stem + "-"))
                         for stem in stems)

          licenses = sorted(path.decode("utf-8") for path in paths if path and is_license_file(path))
          if not licenses:
              raise SystemExit("pinned upstream source contains no tracked license files")
          for relative in licenses:
              target = destination / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source / relative, target)
          (destination / "INDEX.txt").write_text("\n".join(licenses) + "\n", encoding="utf-8")
          entries = []
          for relative in licenses:
              content = (destination / relative).read_bytes()
              entries.append(f"{hashlib.sha256(content).hexdigest()}  {relative}")
          (destination / "SHA256SUMS").write_text("\n".join(entries) + "\n", encoding="utf-8")
          (destination / "README.txt").write_text(
              "Upstream license, notice, attribution and patent files copied from "
              "tracked llama.cpp source at the pinned build commit. INDEX.txt lists "
              "source-relative paths; SHA256SUMS verifies each copied file.\n",
              encoding="utf-8")
          PY_LICENSES
          python3 - "$package" <<'PY_CHECK_LICENSES'
          from pathlib import Path
          import sys

          package = Path(sys.argv[1])
          bundle = package / "share/licenses/upstream"
          expected = ("licenses/LICENSE-jsonhpp", "vendor/cpp-httplib/LICENSE")
          for relative in expected:
              path = bundle / relative
              if not path.is_file() or path.stat().st_size == 0:
                  indexed = (bundle / "INDEX.txt").read_text(encoding="utf-8") if (bundle / "INDEX.txt").exists() else "<missing index>"
                  raise SystemExit(f"required upstream notice is missing: {relative}; index: {indexed}")
          print(f"Bundled {len((bundle / 'INDEX.txt').read_text(encoding='utf-8').splitlines())} tracked upstream license/notice files.")
          PY_CHECK_LICENSES
          file "$package/bin/llama-cli" | tee llama-cli-file.txt
          grep -q 'ARM aarch64' llama-cli-file.txt
          readelf -d "$package/bin/llama-cli" | grep -F '$ORIGIN/../lib'
          if readelf -d "$package/bin/llama-cli" | grep -E '/home/runner|/workspace/'; then
            echo 'Unexpected build-host path in executable dynamic section.' >&2
            exit 1
          fi
          ldd "$package/bin/llama-cli" | tee llama-cli-ldd.txt
          ! grep -q 'not found' llama-cli-ldd.txt
          "$package/bin/llama-cli" --version
          "$package/bin/llama-cli" --list-devices
          package_commit="$(git -C llama.cpp rev-parse HEAD)"
          cat > "$package/README.txt" <<'EOF'
          Ternux llama.cpp CPU + Vulkan package

          Target: Linux ARM64 / Debian-family glibc
          Upstream: ggml-org/llama.cpp b11582
          Upstream commit: af50f2f248b475d9760f8e67503d01c0f194f5f4
          Backends: CPU and Vulkan (GGML_HEXAGON=OFF)

          This package contains llama.cpp tools and libraries. It does not
          include model weights, Vulkan loader, Mesa/Turnip, Qualcomm runtime,
          firmware, or a FastRPC broker. A working system Vulkan ICD is required
          for GPU offload. The package requires glibc 2.38 or newer and the
          guest's system libssl3, libgomp1, and libvulkan1 runtime libraries.
          On Ternux, verify the renderer and device with `vulkaninfo --summary`
          before selecting Vulkan.
          EOF
          cat > "$package/env.sh" <<'EOF'
          # Source this file to use the packaged llama.cpp tools.
          LLAMA_HOME="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LLAMA_HOME
          export LD_LIBRARY_PATH="$LLAMA_HOME/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PATH="$LLAMA_HOME/bin:$PATH"
          if [ -z "${VK_ICD_FILENAMES:-}" ]; then
            for _tnx_icd in \
              /usr/local/share/vulkan/icd.d/ternux_freedreno_icd.json \
              /usr/share/vulkan/icd.d/freedreno_icd.aarch64.json; do
              if [ -f "$_tnx_icd" ]; then
                export VK_ICD_FILENAMES="$_tnx_icd"
                break
              fi
            done
          fi
          unset _tnx_icd
          EOF
          cat > "$package/build-manifest.json" <<EOF
          {
            "artifact": "ternux-llama-vulkan-linux-arm64-b11582",
            "target": "linux-aarch64",
            "upstream": "https://github.com/ggml-org/llama.cpp",
            "upstream_tag": "b11582",
            "upstream_commit": "$package_commit",
            "ternux_commit": "$GITHUB_SHA",
            "build_runner": "GitHub-hosted ubuntu-24.04-arm",
            "cmake_options": {
              "CMAKE_BUILD_TYPE": "Release",
              "GGML_NATIVE": "OFF",
              "GGML_VULKAN": "ON",
              "GGML_HEXAGON": "OFF",
              "GGML_OPENCL": "OFF",
              "LLAMA_BUILD_TESTS": "OFF"
            },
            "install_rpath": "\$ORIGIN/../lib",
            "minimum_glibc": "2.38",
            "system_runtime_dependencies": [
              "libssl.so.3", "libcrypto.so.3", "libgomp.so.1", "libvulkan.so.1"
            ],
            "license_file": "LLAMA-CPP-LICENSE",
            "upstream_license_bundle": "share/licenses/upstream/INDEX.txt",
            "upstream_license_checksums": "share/licenses/upstream/SHA256SUMS",
            "device_validation": "CPU and Vulkan known-answer passed on SM8735/Adreno 825; see release notes"
          }
          EOF
          python3 tools/generate_llama_vulkan_component_manifest.py "$package" llama.cpp .
          python3 tests/llama_vulkan_abi_audit.py "$package"
          tar -C package -czf \
            ternux-llama-vulkan-linux-arm64-b11582.tar.gz \
            ternux-llama-vulkan-linux-arm64-b11582
          sha256sum ternux-llama-vulkan-linux-arm64-b11582.tar.gz \
            > ternux-llama-vulkan-linux-arm64-b11582.tar.gz.sha256
          tar -tzf ternux-llama-vulkan-linux-arm64-b11582.tar.gz \
            > release-contents.txt
          (cd "$package/share/licenses/upstream" && sha256sum -c SHA256SUMS)
          while IFS= read -r license_path; do
            grep -Fqx "ternux-llama-vulkan-linux-arm64-b11582/share/licenses/upstream/$license_path" \
              release-contents.txt
          done < "$package/share/licenses/upstream/INDEX.txt"

      - name: Upload inspected candidate artifact
        uses: actions/upload-artifact@v6
        with:
          name: ternux-llama-vulkan-linux-arm64-b11582-candidate
          path: |
            ternux-llama-vulkan-linux-arm64-b11582.tar.gz
            ternux-llama-vulkan-linux-arm64-b11582.tar.gz.sha256
          if-no-files-found: error

  publish-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview == true && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require main before updating the public prerelease
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Publishing the public prerelease is restricted to main.' >&2
            exit 1
          fi

      - name: Download inspected candidate
        uses: actions/download-artifact@v7
        with:
          name: ternux-llama-vulkan-linux-arm64-b11582-candidate
          path: candidate

      - name: Create or refresh the draft device-validation release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=ternux-llama-vulkan-linux-arm64-b11582
          cat > release-notes.md <<'EOF'
          ## CPU + Vulkan prerelease

          Built from llama.cpp `b11582` commit
          `af50f2f248b475d9760f8e67503d01c0f194f5f4` on a native Linux ARM64
          GitHub-hosted runner. The package includes CPU and Vulkan backends;
          it does not bundle models or graphics/vendor runtimes.

          Device validation on a Redmi Turbo 4 Pro (SM8735, Android 16, Debian
          PRoot) passed after installation through `ternux extension install
          llama-vulkan`: Qwen2.5 1.5B Q4_0 returned `4` on CPU and Vulkan, and
          verbose Vulkan output identified Adreno 825 with all 29/29 layers
          offloaded. This is an optional prerelease artifact, not a stable
          Ternux version release. See the build manifest, source-component map, and checksum included
          in the archive.
          EOF
          archive=candidate/ternux-llama-vulkan-linux-arm64-b11582.tar.gz
          checksum=candidate/ternux-llama-vulkan-linux-arm64-b11582.tar.gz.sha256
          test -s "$archive"
          test -s "$checksum"
          (cd candidate && sha256sum --check ternux-llama-vulkan-linux-arm64-b11582.tar.gz.sha256)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" "$checksum" --clobber
            gh release edit "$tag" \
              --title 'Ternux llama.cpp CPU + Vulkan (ARM64, b11582)' \
              --notes-file release-notes.md --prerelease
          else
            gh release create "$tag" "$archive" "$checksum" \
              --draft --prerelease \
              --title 'Ternux llama.cpp CPU + Vulkan (ARM64, b11582)' \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
