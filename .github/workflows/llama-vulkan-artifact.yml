name: llama.cpp CPU + Vulkan artifact

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a new prerelease (requires a verified, unused release tag)"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "New, unused release tag; required only when publish is enabled"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: llama-vulkan-b11582
  cancel-in-progress: false

jobs:
  build:
    name: Build pinned Linux ARM64 CPU + Vulkan package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out Ternux metadata
        uses: actions/checkout@v4

      - name: Install Vulkan build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build git pkg-config libvulkan-dev glslc \
            libshaderc-dev glslang-dev glslang-tools spirv-headers \
            libssl-dev libgomp1 libvulkan1

      - name: Check out pinned llama.cpp source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: af50f2f248b475d9760f8e67503d01c0f194f5f4
          path: llama.cpp

      - name: Verify source pin and native target
        run: |
          set -euo pipefail
          test "$(git -C llama.cpp rev-parse HEAD)" = \
            af50f2f248b475d9760f8e67503d01c0f194f5f4
          test "$(uname -m)" = aarch64

      - name: Configure, build, install, and inspect
        shell: bash
        run: |
          set -euo pipefail
          package="$GITHUB_WORKSPACE/package/ternux-llama-vulkan-linux-arm64-b11582"
          cmake -S llama.cpp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$package" \
            -DCMAKE_INSTALL_RPATH='$ORIGIN/../lib' \
            -DGGML_NATIVE=OFF \
            -DGGML_VULKAN=ON \
            -DGGML_HEXAGON=OFF \
            -DGGML_OPENCL=OFF \
            -DLLAMA_BUILD_TESTS=OFF
          cmake --build build --parallel 4
          cmake --install build --prefix "$package"
          install -m 0644 llama.cpp/LICENSE "$package/LLAMA-CPP-LICENSE"
          install -m 0644 LICENSE "$package/TERNUX-LICENSE"
          install -m 0644 NOTICE "$package/TERNUX-NOTICE"
          install -m 0644 LICENSE-SCOPE.md "$package/TERNUX-LICENSE-SCOPE.txt"
          install -m 0644 LICENSE-COMMERCIAL-ADDENDUM.md "$package/TERNUX-COMMERCIAL-ADDENDUM.txt"
          install -m 0644 THIRD_PARTY_NOTICES.md "$package/TERNUX-THIRD-PARTY-NOTICES.txt"
          python3 - <<'PY_LICENSES'
          from pathlib import Path
          import shutil
          import subprocess

          package = Path("package/ternux-llama-vulkan-linux-arm64-b11582")
          destination = package / "upstream-licenses"
          paths = subprocess.run(
              ["git", "-C", "llama.cpp", "ls-files", "-z"],
              check=True, capture_output=True,
          ).stdout.split(b"\0")

          def is_license_file(raw_path: bytes) -> bool:
              name = Path(raw_path.decode("utf-8")).name.upper()
              if name.endswith(".CMAKE"):
                  return False
              return (
                  name in {"LICENSE", "COPYING", "NOTICE"}
                  or name.startswith(("LICENSE.", "LICENSE-", "COPYING.", "COPYING-", "NOTICE.", "NOTICE-"))
              )

          licenses = sorted(path.decode("utf-8") for path in paths if path and is_license_file(path))
          if not licenses:
              raise SystemExit("pinned upstream source contains no tracked license or notice files")
          for relative in licenses:
              target = destination / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(Path("llama.cpp") / relative, target)
          (destination / "INDEX.txt").write_text("\n".join(licenses) + "\n", encoding="utf-8")
          PY_LICENSES
          file "$package/bin/llama-cli" | tee llama-cli-file.txt
          grep -q 'ARM aarch64' llama-cli-file.txt
          readelf -d "$package/bin/llama-cli" | grep -F '$ORIGIN/../lib'
          if readelf -d "$package/bin/llama-cli" | grep -E '/home/runner|/workspace/'; then
            echo 'Unexpected build-host path in executable dynamic section.' >&2
            exit 1
          fi
          ldd "$package/bin/llama-cli" | tee llama-cli-ldd.txt
          ! grep -q 'not found' llama-cli-ldd.txt
          "$package/bin/llama-cli" --version
          "$package/bin/llama-cli" --list-devices
          package_commit="$(git -C llama.cpp rev-parse HEAD)"
          cat > "$package/README.txt" <<'EOF'
          Ternux llama.cpp CPU + Vulkan package

          Target: Linux ARM64 / Debian-family glibc
          Upstream: ggml-org/llama.cpp b11582
          Upstream commit: af50f2f248b475d9760f8e67503d01c0f194f5f4
          Backends: CPU and Vulkan (GGML_HEXAGON=OFF)

          This package contains llama.cpp tools and libraries. It does not
          include model weights, Vulkan loader, Mesa/Turnip, Qualcomm runtime,
          firmware, or a FastRPC broker. A working system Vulkan ICD is required
          for GPU offload. The package requires glibc 2.38 or newer and the
          guest's system libssl3, libgomp1, and libvulkan1 runtime libraries.
          On Ternux, verify the renderer and device with `vulkaninfo --summary`
          before selecting Vulkan.

          Ternux's first-party package helpers are under PolyForm Noncommercial 1.0.0;
          company use requires a separate commercial license. See TERNUX-LICENSE,
          TERNUX-LICENSE-SCOPE.txt, TERNUX-NOTICE, and
          TERNUX-THIRD-PARTY-NOTICES.txt and
          TERNUX-COMMERCIAL-ADDENDUM.txt. Upstream llama.cpp and vendored
          dependency license/notice files are under upstream-licenses/.
          EOF
          cat > "$package/env.sh" <<'EOF'
          # Source this file to use the packaged llama.cpp tools.
          LLAMA_HOME="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LLAMA_HOME
          export LD_LIBRARY_PATH="$LLAMA_HOME/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PATH="$LLAMA_HOME/bin:$PATH"
          if [ -z "${VK_ICD_FILENAMES:-}" ]; then
            for _tnx_icd in \
              /usr/local/share/vulkan/icd.d/ternux_freedreno_icd.json \
              /usr/share/vulkan/icd.d/freedreno_icd.aarch64.json; do
              if [ -f "$_tnx_icd" ]; then
                export VK_ICD_FILENAMES="$_tnx_icd"
                break
              fi
            done
          fi
          unset _tnx_icd
          EOF
          cat > "$package/build-manifest.json" <<EOF
          {
            "artifact": "ternux-llama-vulkan-linux-arm64-b11582",
            "target": "linux-aarch64",
            "upstream": "https://github.com/ggml-org/llama.cpp",
            "upstream_tag": "b11582",
            "upstream_commit": "$package_commit",
            "build_runner": "GitHub-hosted ubuntu-24.04-arm",
            "cmake_options": {
              "CMAKE_BUILD_TYPE": "Release",
              "GGML_NATIVE": "OFF",
              "GGML_VULKAN": "ON",
              "GGML_HEXAGON": "OFF",
              "GGML_OPENCL": "OFF",
              "LLAMA_BUILD_TESTS": "OFF"
            },
            "install_rpath": "\$ORIGIN/../lib",
            "minimum_glibc": "2.38",
            "system_runtime_dependencies": [
              "libssl.so.3", "libcrypto.so.3", "libgomp.so.1", "libvulkan.so.1"
            ],
            "license_files": ["LLAMA-CPP-LICENSE", "TERNUX-LICENSE", "TERNUX-LICENSE-SCOPE.txt", "TERNUX-COMMERCIAL-ADDENDUM.txt", "TERNUX-NOTICE", "TERNUX-THIRD-PARTY-NOTICES.txt", "upstream-licenses/INDEX.txt"],
            "device_validation": "CPU and Vulkan known-answer passed on SM8735/Adreno 825; see release notes"
          }
          EOF
          python3 tests/llama_vulkan_abi_audit.py "$package"
          tar -C package -czf \
            ternux-llama-vulkan-linux-arm64-b11582.tar.gz \
            ternux-llama-vulkan-linux-arm64-b11582
          sha256sum ternux-llama-vulkan-linux-arm64-b11582.tar.gz \
            > ternux-llama-vulkan-linux-arm64-b11582.tar.gz.sha256
          tar -tzf ternux-llama-vulkan-linux-arm64-b11582.tar.gz \
            > release-contents.txt
          while IFS= read -r license_path; do
            grep -Fqx "ternux-llama-vulkan-linux-arm64-b11582/upstream-licenses/$license_path" release-contents.txt
          done < package/ternux-llama-vulkan-linux-arm64-b11582/upstream-licenses/INDEX.txt
          for license_path in TERNUX-LICENSE TERNUX-LICENSE-SCOPE.txt TERNUX-COMMERCIAL-ADDENDUM.txt TERNUX-NOTICE TERNUX-THIRD-PARTY-NOTICES.txt; do
            grep -Fqx "ternux-llama-vulkan-linux-arm64-b11582/$license_path" release-contents.txt
          done

      - name: Create a new device-validation release
        if: inputs.publish == true && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ -z "$tag" ]]; then
            echo "publish=true requires a new release_tag" >&2
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$tag"; then
            echo "Invalid Git tag name: $tag" >&2
            exit 1
          fi
          existing_release="$(gh release list --limit 1000 --json tagName --jq 'any(.[]; .tagName == strenv(RELEASE_TAG))')"
          if [[ "$existing_release" == "true" ]]; then
            echo "Refusing to overwrite existing GitHub Release: $tag" >&2
            exit 1
          fi
          if ! remote_tags="$(git ls-remote origin "refs/tags/$tag")"; then
            echo "Could not verify whether Git tag exists: $tag" >&2
            exit 1
          fi
          if [[ -n "$remote_tags" ]]; then
            echo "Refusing to reuse existing Git tag: $tag" >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## CPU + Vulkan prerelease

          Built from llama.cpp `b11582` commit
          `af50f2f248b475d9760f8e67503d01c0f194f5f4` on a native Linux ARM64
          GitHub-hosted runner. The package includes CPU and Vulkan backends;
          it does not bundle models or graphics/vendor runtimes.

          Device validation on a Redmi Turbo 4 Pro (SM8735, Android 16, Debian
          PRoot) passed after installation through `ternux extension install
          llama-vulkan`: Qwen2.5 1.5B Q4_0 returned `4` on CPU and Vulkan, and
          verbose Vulkan output identified Adreno 825 with all 29/29 layers
          offloaded. This is an optional prerelease artifact, not a stable
          Ternux version release. See the build manifest and checksum included
          in the archive.
          EOF
          gh release create "$tag" \
            ternux-llama-vulkan-linux-arm64-b11582.tar.gz \
            ternux-llama-vulkan-linux-arm64-b11582.tar.gz.sha256 \
            --draft --prerelease \
            --title 'Ternux llama.cpp CPU + Vulkan (ARM64, b11582)' \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
