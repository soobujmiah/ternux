name: Repo Knowledge Sync

# Rollout of soobujmiah/skb's governance/DETERMINISTIC_STATE_SYNC_POLICY.md to this repository
# (DEC-2026-09-25-002). tools/repo_knowledge/ and schemas/*.schema.json are vendored copies from
# soobujmiah/skb -- see tools/repo_knowledge/README.md. Do not hand-edit .repo/; it is
# regenerated by this workflow.
#
# Re-runs Ternux's Validate checks directly (bash syntax, focused regressions, Bats, UI, docs,
# JavaScript syntax, and committed-diff whitespace). The sync status aggregates every check so
# a passing focused test cannot hide a failure elsewhere. paths-ignore prevents the generated
# .repo commit from retriggering this workflow.

on:
  push:
    branches: [main]
    paths-ignore:
      - ".repo/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: repo-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Run tools/repo_knowledge tests
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py' -v

  sync:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Install Bats
        id: bats
        timeout-minutes: 5
        run: |
          set -u
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 &&
               sudo apt-get install --yes --no-install-recommends bats; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Bash syntax check (build signal)
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          for file in install.sh uninstall.sh bin/ternux bin/ternux-guest lib/*.sh; do
            bash -n "$file"
          done

      - name: Run focused regressions (test signal)
        id: tests
        continue-on-error: true
        run: bash tests/focused.sh

      - name: Run Bats smoke suite
        id: bats_smoke
        continue-on-error: true
        run: bats tests/smoke.bats

      - name: Render installer UI in pseudo terminal
        id: ui
        continue-on-error: true
        run: python3 tests/ui_render.py

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build documentation site
        id: site_build
        continue-on-error: true
        run: |
          npm ci
          npm run build

      - name: Validate documentation and bilingual site structure
        id: docs
        continue-on-error: true
        run: python3 tests/docs_check.py

      - name: Check build script syntax
        id: js_syntax
        continue-on-error: true
        run: node --check scripts/finalize-site.mjs

      - name: Reject whitespace errors in the committed change
        id: whitespace
        continue-on-error: true
        run: git show --check --format= HEAD

      - name: Run tools/repo_knowledge tests (guard the vendored copy)
        id: tool_tests
        continue-on-error: true
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py'

      - name: Collect and sync deterministic state
        if: always()
        run: |
          build_status="${{ steps.build.outcome == 'success' && 'passed' || 'failed' }}"
          test_status="${{ steps.tests.outcome == 'success' && steps.bats_smoke.outcome == 'success' && steps.ui.outcome == 'success' && steps.site_build.outcome == 'success' && steps.docs.outcome == 'success' && steps.js_syntax.outcome == 'success' && steps.whitespace.outcome == 'success' && steps.tool_tests.outcome == 'success' && 'passed' || 'failed' }}"
          python3 -m tools.repo_knowledge sync --ci \
            --build-status "$build_status" --build-run-id "${{ github.run_id }}" \
            --test-status "$test_status" --test-summary "focused regressions + Bats + UI + site build + docs + JavaScript syntax + whitespace + repo knowledge tests (ci.yml)" \
            --test-run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --workflow-name "${{ github.workflow }}" \
            --event-type "${{ github.event_name }}" \
            --actor "${{ github.actor }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Verify .repo/ against schemas
        if: always()
        run: python3 -m tools.repo_knowledge verify

      - name: Open repository state update pull request
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        id: state_pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/repo-knowledge-state
          base: main
          delete-branch: true
          add-paths: .repo/
          commit-message: "chore(repo-knowledge): sync deterministic state for ${{ github.sha }}"
          title: "chore(repo-knowledge): sync deterministic state"
          body: |
            Automated deterministic state update from [workflow run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            This pull request keeps repository-state updates behind the required pull request and CI protections on `main`.

      - name: Approve checks for generated state pull request
        if: always() && steps.state_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: automation/repo-knowledge-state
          STATE_HEAD_SHA: ${{ steps.state_pr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$STATE_BRANCH&event=pull_request&per_page=100")
            count=$(printf '%s' "$runs" | jq --arg sha "$STATE_HEAD_SHA" '[.workflow_runs[] | select(.head_sha == $sha and (.name == "Validate" or .name == "Repository State Contract" or .name == "Termux APT package artifact" or .name == "Repo Knowledge Sync"))] | unique_by(.name) | length')
            ids=$(printf '%s' "$runs" | jq -r --arg sha "$STATE_HEAD_SHA" '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "action_required" and (.name == "Validate" or .name == "Repository State Contract" or .name == "Termux APT package artifact" or .name == "Repo Knowledge Sync")) | .id')
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
            done <<EOF_RUNS
          $ids
          EOF_RUNS
            [ "$count" -ge 4 ] && exit 0
            sleep 2
          done
          echo "Timed out waiting for all four generated-PR checks to register" >&2
          exit 1

      - name: Notify SKB about repository state update
        if: always() && steps.state_pr.outputs.pull-request-number != ''
        env:
          SKB_DISPATCH_TOKEN: ${{ secrets.SKB_DISPATCH_TOKEN || secrets.SKB_RETURN_TOKEN || '' }}
          STATE_HEAD_SHA: ${{ steps.state_pr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          if [ -n "$SKB_DISPATCH_TOKEN" ]; then
            curl -fsSL -X POST \
              -H "Authorization: Bearer $SKB_DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/soobujmiah/skb/dispatches \
              -d "{\"event_type\":\"repo-state-updated\",\"client_payload\":{\"project_id\":\"ternux\",\"repository\":\"${{ github.repository }}\",\"run_id\":\"${{ github.run_id }}\",\"sha\":\"$STATE_HEAD_SHA\"}}" || true
          fi
