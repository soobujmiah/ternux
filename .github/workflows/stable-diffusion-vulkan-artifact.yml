name: Stable Diffusion CPU + Vulkan extension artifact

on:
  pull_request:
    paths:
      - .github/workflows/stable-diffusion-vulkan-artifact.yml
      - tests/stable_diffusion_abi_audit.py
      - tests/stable_diffusion_license_bundle_test.py
      - tools/build_stable_diffusion_license_bundle.py
      - packaging/stable-diffusion/components.json
      - LICENSE
      - NOTICE
      - lib/extension.sh
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish or refresh the pinned optional prerelease asset
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stable-diffusion-vulkan-master-1053
  cancel-in-progress: false

jobs:
  build:
    name: Build and inspect pinned Linux ARM64 CPU + Vulkan package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out Ternux metadata
        uses: actions/checkout@v5

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build git pkg-config libvulkan-dev \
            glslc glslang-tools spirv-headers libgomp1 libvulkan1 \
            python3 binutils file

      - name: Check out pinned stable-diffusion.cpp source
        uses: actions/checkout@v5
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 5a1ba5d895bec4e07deab80d6d791721cd59d9c2
          submodules: recursive
          path: stable-diffusion.cpp

      - name: Verify source pin and native target
        run: |
          set -euo pipefail
          test "$(git -C stable-diffusion.cpp rev-parse HEAD)" = \
            5a1ba5d895bec4e07deab80d6d791721cd59d9c2
          test "$(git -C stable-diffusion.cpp/ggml rev-parse HEAD)" = \
            135ce1e0e3f2b0693d3de93d4f6b5fa0a1947820
          test "$(uname -m)" = aarch64

      - name: Configure and compile the pinned ARM64 target
        shell: bash
        run: |
          set -euo pipefail
          cmake -S stable-diffusion.cpp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_VULKAN=ON \
            -DGGML_NATIVE=OFF \
            -DSD_BUILD_EXAMPLES=ON \
            -DSD_SERVER_BUILD_FRONTEND=OFF \
            -DSD_WEBP=OFF \
            -DSD_WEBM=OFF
          cmake --build build --target sd-cli --parallel 4
          install -D -m 0755 build/bin/sd-cli \
            "$GITHUB_WORKSPACE/package/ternux-stable-diffusion-vulkan-linux-arm64-master-1053/bin/sd-cli"

      - name: Inspect ARM64 binary and record runtime build metadata
        shell: bash
        run: |
          set -euo pipefail
          tag=ternux-stable-diffusion-vulkan-linux-arm64-master-1053
          package="$GITHUB_WORKSPACE/package/$tag"
          test -s "$package/bin/sd-cli"
          chmod 0755 "$package/bin/sd-cli"
          file "$package/bin/sd-cli" | tee sd-cli-file.txt
          grep -q 'ARM aarch64' sd-cli-file.txt
          if readelf -d "$package/bin/sd-cli" | grep -E '/home/runner|/workspace/'; then
            echo 'Unexpected build-host path in executable dynamic section.' >&2
            exit 1
          fi
          ldd "$package/bin/sd-cli" | tee sd-cli-ldd.txt
          ! grep -q 'not found' sd-cli-ldd.txt
          "$package/bin/sd-cli" --help > sd-cli-help.txt
          grep -q -- '--backend' sd-cli-help.txt
          grep -q -- '--model' sd-cli-help.txt
          grep -q -- 'vulkan' sd-cli-help.txt
          find build -type f -name '*vulkan*' -o -name '*Vulkan*' | grep -q .
          source_commit="$(git -C stable-diffusion.cpp rev-parse HEAD)"
          cat > "$package/env.sh" <<'ENV'
          # Source this file to use the optional CPU + Vulkan image generator.
          SD_HOME="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export SD_HOME
          export LD_LIBRARY_PATH="$SD_HOME/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PATH="$SD_HOME/bin:$PATH"
          if [ -z "${VK_ICD_FILENAMES:-}" ]; then
            for _tnx_icd in \
              /usr/local/share/vulkan/icd.d/ternux_freedreno_icd.json \
              /usr/share/vulkan/icd.d/freedreno_icd.aarch64.json; do
              if [ -f "$_tnx_icd" ]; then
                export VK_ICD_FILENAMES="$_tnx_icd"
                break
              fi
            done
          fi
          unset _tnx_icd
          ENV
          cat > "$package/build-manifest.json" <<MANIFEST
          {
            "artifact": "$tag",
            "target": "linux-aarch64",
            "upstream": "https://github.com/leejet/stable-diffusion.cpp",
            "upstream_tag": "master-1053-5a1ba5d",
            "upstream_commit": "$source_commit",
            "build_runner": "GitHub-hosted ubuntu-24.04-arm",
            "backends": ["CPU", "Vulkan"],
            "cmake_options": {
              "CMAKE_BUILD_TYPE": "Release",
              "SD_VULKAN": "ON",
              "GGML_NATIVE": "OFF",
              "SD_BUILD_EXAMPLES": "ON",
              "SD_SERVER_BUILD_FRONTEND": "OFF",
              "SD_WEBP": "OFF",
              "SD_WEBM": "OFF"
            },
            "minimum_glibc": "2.39",
            "system_runtime_dependencies": ["libgomp.so.1", "libvulkan.so.1"],
            "license_bundle": "share/licenses/SHA256SUMS",
            "license_index": "share/licenses/INDEX.txt",
            "license_components": "share/licenses/COMPONENTS.json",
            "weights_included": false,
            "device_validation": "SM8735 Adreno 825: tiled Vulkan 512x512/10-step image completed in 101.9s; untiled VAE lost device; CPU output quality unqualified; broader stability and performance not claimed"
          }
          MANIFEST

      - name: Build and independently audit component license bundle
        shell: bash
        run: |
          set -euo pipefail
          tag=ternux-stable-diffusion-vulkan-linux-arm64-master-1053
          package="$GITHUB_WORKSPACE/package/$tag"
          python3 tools/build_stable_diffusion_license_bundle.py \
            --tree "stable-diffusion.cpp=stable-diffusion.cpp" \
            --optional-tree "cmake-deps=build/_deps" \
            --components packaging/stable-diffusion/components.json \
            --extra "LICENSE=TERNUX-LICENSE" \
            --extra "NOTICE=TERNUX-NOTICE" \
            --require "stable-diffusion.cpp/LICENSE" \
            --require "stable-diffusion.cpp/ggml/AUTHORS" \
            --require "stable-diffusion.cpp/thirdparty/LICENSE.darts_clone.txt" \
            --require "stable-diffusion.cpp/thirdparty/oniguruma/COPYING" \
            --require "stable-diffusion.cpp/thirdparty/utf8proc/LICENSE.md" \
            --require "TERNUX-LICENSE" \
            --require "TERNUX-NOTICE" \
            --output "$package/share/licenses"
          python3 tests/stable_diffusion_abi_audit.py "$package"
          tar -C package -czf "$tag.tar.gz" "$tag"
          sha256sum "$tag.tar.gz" > "$tag.tar.gz.sha256"
          tar -tzf "$tag.tar.gz" > release-contents.txt

      - name: Upload inspected prerelease candidate
        uses: actions/upload-artifact@v6
        with:
          name: ternux-stable-diffusion-vulkan-linux-arm64-master-1053-candidate
          path: |
            ternux-stable-diffusion-vulkan-linux-arm64-master-1053.tar.gz
            ternux-stable-diffusion-vulkan-linux-arm64-master-1053.tar.gz.sha256
            release-contents.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the optional preview archive
    if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download inspected prerelease candidate
        uses: actions/download-artifact@v7
        with:
          name: ternux-stable-diffusion-vulkan-linux-arm64-master-1053-candidate

      - name: Publish optional prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=ternux-stable-diffusion-vulkan-linux-arm64-master-1053
          cat > release-notes.md <<'NOTES'
          ## CPU + Vulkan Stable Diffusion extension prerelease

          Built from stable-diffusion.cpp `master-1053-5a1ba5d` commit
          `5a1ba5d895bec4e07deab80d6d791721cd59d9c2` on a native Linux ARM64
          runner. Provides CPU and Vulkan backends. Model weights and Vulkan
          driver/ICD are not included. The model's own license applies to its
          weights and outputs. This artifact has build/ABI validation only;
          device image quality and performance are not yet qualified.
          Device check: an extracted candidate generated a coherent 512x512,
          10-step image on SM8735/Adreno 825 with Vulkan VAE tiling in 101.9 s.
          Untiled VAE decoding lost the Vulkan device on that phone. CPU image
          quality is unqualified; broad device, quality, memory, cancellation,
          and sustained-use qualification remain open. Keep CPU use diagnostic
          until its image quality is independently established.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$tag.tar.gz" "$tag.tar.gz.sha256" --clobber
            gh release edit "$tag" --title 'Ternux Stable Diffusion CPU + Vulkan (ARM64)' \
              --notes-file release-notes.md --prerelease
          else
            gh release create "$tag" "$tag.tar.gz" "$tag.tar.gz.sha256" \
              --prerelease --title 'Ternux Stable Diffusion CPU + Vulkan (ARM64)' \
              --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
