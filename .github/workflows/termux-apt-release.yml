name: Sign or publish the Termux APT repository

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify signing setup without deployment, or publish after every release gate is closed
        required: true
        type: choice
        options:
          - verify-signing
          - publish-v2
        default: verify-signing

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'verify-signing' || inputs.mode == 'publish-v2')
    name: Verify signing setup or build the signed v2 APT repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apt-release
    steps:
      - name: Check out Ternux
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the v2 release source
        run: |
          set -euo pipefail
          version="$(sed -n 's/^TERNUX_VERSION="\([^"]*\)"$/\1/p' lib/core.sh | head -n 1)"
          test "$version" = 2.0.0 || {
            printf 'Refusing release build for Ternux %s; expected 2.0.0.\n' "$version" >&2
            exit 1
          }

      - name: Check out pinned Termux package builder
        uses: actions/checkout@v4
        with:
          repository: termux/termux-create-package
          ref: a7e20f92cfc9664a6ab6232bc826e86da73a8524
          path: tools/termux-create-package
          persist-credentials: false

      - name: Check out pinned Termux APT repository builder
        uses: actions/checkout@v4
        with:
          repository: termux/termux-apt-repo
          ref: f2bf088281248e8817b913cc778750796ea5dc19
          path: tools/termux-apt-repo
          persist-credentials: false

      - name: Install repository index tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xz-utils binutils dpkg-dev gnupg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned package-builder dependency
        run: >-
          python -m pip install --disable-pip-version-check --no-deps --require-hashes
          -r packaging/termux/requirements-build.txt
        shell: bash

      - name: Build, sign, and verify APT repository
        env:
          GNUPGHOME: ${{ runner.temp }}/ternux-apt-gnupg
          TERNUX_APT_SIGNING_FINGERPRINT: ${{ vars.TERNUX_APT_SIGNING_FINGERPRINT }}
          TERNUX_APT_SIGNING_PASSPHRASE: ${{ secrets.TERNUX_APT_SIGNING_PASSPHRASE }}
          TERNUX_APT_SIGNING_KEY: ${{ secrets.TERNUX_APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          : "${TERNUX_APT_SIGNING_FINGERPRINT:?Set the environment variable to the full signing fingerprint}"
          : "${TERNUX_APT_SIGNING_KEY:?Set the protected environment secret TERNUX_APT_SIGNING_KEY}"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$TERNUX_APT_SIGNING_KEY" | gpg --batch --import
          unset TERNUX_APT_SIGNING_KEY
          gpg --batch --with-colons --list-secret-keys "$TERNUX_APT_SIGNING_FINGERPRINT" |
            awk -F: '$1 == "fpr" {print toupper($10)}' |
            grep -Fxq "${TERNUX_APT_SIGNING_FINGERPRINT^^}"
          TERMUX_CREATE_PACKAGE="$GITHUB_WORKSPACE/tools/termux-create-package/src/termux-create-package" \
            bash packaging/termux/build.sh
          TERMUX_APT_REPO_TOOL="$GITHUB_WORKSPACE/tools/termux-apt-repo/termux-apt-repo" \
            bash packaging/termux/build-repository.sh --sign
          deb="$(find artifacts/ternux-apt/debs -maxdepth 1 -type f -name 'ternux_2.0.0_all.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb --field "$deb" Package)" = ternux
          test "$(dpkg-deb --field "$deb" Version)" = 2.0.0
          test "$(dpkg-deb --field "$deb" Architecture)" = all
          dpkg-deb --contents "$deb" >/dev/null
          sha256sum "$deb" | tee "$deb.sha256"
          {
            printf 'project_commit=%s\n' "$GITHUB_SHA"
            printf 'package_builder_commit=%s\n' a7e20f92cfc9664a6ab6232bc826e86da73a8524
            printf 'apt_repo_builder_commit=%s\n' f2bf088281248e8817b913cc778750796ea5dc19
            printf 'package_version=2.0.0\n'
            printf 'signing_fingerprint=%s\n' "${TERNUX_APT_SIGNING_FINGERPRINT^^}"
          } > artifacts/ternux-apt/build-info.txt
      - name: Remove ephemeral signing key material
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/ternux-apt-gnupg
        run: |
          if [ -d "$GNUPGHOME" ]; then
            gpgconf --homedir "$GNUPGHOME" --kill all >/dev/null 2>&1 || true
            rm -rf -- "$GNUPGHOME"
          fi

      - name: Build Ternux website
        if: inputs.mode == 'publish-v2'
        run: |
          npm ci
          npm run build

      - name: Add signed APT repository after the site build
        if: inputs.mode == 'publish-v2'
        run: |
          set -euo pipefail
          install -d dist/apt
          cp -a artifacts/ternux-apt/repository/. dist/apt/
          test -s dist/apt/dists/stable/InRelease
          test -s dist/apt/ternux-archive-key.asc

      - name: Upload Pages artifact
        if: inputs.mode == 'publish-v2'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'publish-v2'
    name: Publish website and signed APT repository
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
