# ternux — GitHub Pages / Jekyll configuration
# https://github.com/soobujmiah/ternux

title: ternux
description: >-
  An evidence-led Debian and Xfce workspace for Android using Termux,
  PRoot Distro, Termux:X11, and explicit graphics backends.
url: https://soobujmiah.github.io
baseurl: /ternux
repository: soobujmiah/ternux

lang: en
timezone: Asia/Dhaka
copyright: 2026 Sobuj Miah
version: 1.3.0

# GitHub Pages supports these settings without third-party plugins.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
highlighter: rouge
strict_front_matter: true

# Every rendered Markdown page receives the professional documentation shell.
# The two landing pages explicitly use `layout: null`.
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "docs"
    values:
      lang: en
  - scope:
      path: "bn/docs"
    values:
      lang: bn

exclude:
  - tests
  - vendor
  - docs/README.md
  - bn/docs/README.md
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - REPO_AUDIT.md
  - "*.bats"
