# Per-page quotes — Copyright (c) 2026 Sobuj Miah (@soobujmiah)

index:
  text: Every locked-down device is a question. Root is one answer; understanding
    is the better one.
  attr: Sobuj Miah
INSTALLATION:
  text: Understanding the machine is free. Making it obey on the first try is the
    work.
  attr: Sobuj Miah
USAGE:
  text: The best tool disappears. You stop operating it and start thinking through
    it.
  attr: Sobuj Miah
CONFIGURATION:
  text: Every setting is a decision someone will inherit. Leave a reason, not just
    a value.
  attr: Sobuj Miah
TROUBLESHOOTING:
  text: Classify the boundary before changing the system. Evidence is safer than guesswork.
  attr: Sobuj Miah
ARCHITECTURE:
  text: Complexity is easy to add and expensive to remove. Build the smallest thing
    that stays true.
  attr: Sobuj Miah
FAQ:
  text: There are no stupid questions, only undocumented behaviour.
  attr: Sobuj Miah
CONTRIBUTING:
  text: Write the code a careful stranger could read at 3am and still trust.
  attr: Sobuj Miah
CHANGELOG:
  text: A changelog is an apology, a promise, and a memory. Keep all three honest.
  attr: Sobuj Miah
QUICK-START:
  text: The fastest path is not the shortest command. It is the one with the
    fewest surprises.
  attr: Sobuj Miah

# --- Bangla ---------------------------------------------------------------
# Same intent as the English lines, written to read naturally in Bangla
# rather than translated word for word.

index_bn:
  text: প্রতিটি বন্ধ করে রাখা যন্ত্র একেকটা প্রশ্ন। root একটা উত্তর; বুঝে ফেলাটা
    তার চেয়ে ভালো উত্তর।
  attr: Sobuj Miah
INSTALLATION_bn:
  text: যন্ত্রটাকে বোঝা যায় বিনা খরচে। প্রথম চেষ্টাতেই তাকে দিয়ে কাজ করানোটাই
    আসল পরিশ্রম।
  attr: Sobuj Miah
USAGE_bn:
  text: সেরা যন্ত্র চোখেই পড়ে না। একসময় আপনি আর সেটি চালান না, সেটির ভেতর দিয়েই
    ভাবতে শুরু করেন।
  attr: Sobuj Miah
CONFIGURATION_bn:
  text: প্রতিটি সেটিং একেকটা সিদ্ধান্ত, যার ভার কাউকে না কাউকে বইতে হবে। শুধু
    মান নয়, কারণটাও লিখে রাখুন।
  attr: Sobuj Miah
TROUBLESHOOTING_bn:
  text: System বদলানোর আগে boundary চিহ্নিত করুন। অনুমানের চেয়ে evidence নিরাপদ।
  attr: Sobuj Miah
ARCHITECTURE_bn:
  text: জটিলতা যোগ করা সহজ, সরানো ব্যয়বহুল। যতটুকু সত্যি থাকবে, ঠিক ততটুকুই
    বানান।
  attr: Sobuj Miah
FAQ_bn:
  text: বোকা প্রশ্ন বলে কিছু নেই, আছে শুধু না-লেখা আচরণ।
  attr: Sobuj Miah
CONTRIBUTING_bn:
  text: এমন কোড লিখুন, রাত তিনটায় কোনো সতর্ক অপরিচিত পড়েও যাতে ভরসা রাখতে পারেন।
  attr: Sobuj Miah
CHANGELOG_bn:
  text: পরিবর্তনের তালিকা একইসঙ্গে ক্ষমা, প্রতিশ্রুতি আর স্মৃতি। তিনটিকেই সৎ
    রাখুন।
  attr: Sobuj Miah
QUICK-START_bn:
  text: দ্রুততম পথ মানে সবচেয়ে ছোট কমান্ড নয়; যেটিতে চমক সবচেয়ে কম, সেটিই দ্রুততম।
  attr: Sobuj Miah
MANUAL:
  text: A script is a decision written once. Doing it by hand is the same
    decision, understood.
  attr: Sobuj Miah
MANUAL_bn:
  text: স্ক্রিপ্ট মানে একবার লেখা একটি সিদ্ধান্ত। হাতে করা মানে সেই সিদ্ধান্তটাই,
    বোঝা হয়ে।
  attr: Sobuj Miah
