<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Ternux and ADT combined workflow</title>
  <desc id="desc">Ternux provides the Debian desktop workspace on Android, while ADT provides the native ARM64 Android build and signing toolchain. They can coexist on the same Termux and PRoot foundation; the combined workflow is experimental until formally measured.</desc>
  <rect width="1200" height="500" rx="20" fill="#050507" stroke="rgba(228,226,223,0.08)" stroke-width="1"/>
  <text x="60" y="58" fill="#e4e2df" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.02em">ternux + ADT</text>
  <text x="60" y="88" fill="rgba(228,226,223,0.5)" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="0.04em">Two layers of one ARM64 Android development workspace</text>
  <rect x="60" y="135" width="1080" height="90" rx="14" fill="#090d0b" stroke="rgba(34,211,238,0.4)" stroke-width="1.5"/>
  <text x="90" y="173" fill="#22d3ee" font-family="'Space Grotesk', sans-serif" font-size="19" font-weight="700">Android ARM64 device</text>
  <text x="90" y="202" fill="rgba(228,226,223,0.6)" font-family="system-ui, sans-serif" font-size="14">Native CPU • memory • Android kernel • device hardware</text>
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="60" y="270" width="500" height="155" rx="14" fill="#090d0b" stroke="rgba(34,197,94,0.45)" stroke-width="1.5"/>
    <text x="90" y="310" fill="#4ade80" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">ternux</text>
    <text x="90" y="341" fill="#e4e2df" font-size="15">Debian + Xfce4 desktop workspace</text>
    <text x="90" y="370" fill="rgba(228,226,223,0.5)" font-size="14">Termux + PRoot • X11 • audio</text>
    <text x="90" y="397" fill="rgba(228,226,223,0.5)" font-size="14">Zink/Turnip on supported Adreno • VirGL fallback</text>

    <rect x="640" y="270" width="500" height="155" rx="14" fill="#090d0b" stroke="rgba(168,85,247,0.45)" stroke-width="1.5"/>
    <text x="670" y="310" fill="#a855f7" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">ADT</text>
    <text x="670" y="341" fill="#e4e2df" font-size="15">Native Linux ARM64 Android toolchain</text>
    <text x="670" y="370" fill="rgba(228,226,223,0.5)" font-size="14">Build-tools • platform-tools • ADB</text>
    <text x="670" y="397" fill="rgba(228,226,223,0.5)" font-size="14">APK build • signing • device installation</text>
  </g>
  <path d="M600 225v35M310 225v45M890 225v45" stroke="rgba(228,226,223,0.2)" stroke-width="1.5" fill="none"/>
  <path d="M600 260l-6-10h12zM310 270l-6-10h12zM890 270l-6-10h12z" fill="rgba(228,226,223,0.4)"/>
  <text x="60" y="463" fill="rgba(228,226,223,0.4)" font-family="'JetBrains Mono', monospace" font-size="12">Coexistence is practical; the cross-project workflow remains experimental until formally tested and measured.</text>
</svg>
